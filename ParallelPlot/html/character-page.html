    <h1 id="characterName">Character Page</h1>
    <!-- Profile Picture Section -->
<h2>Profile Picture</h2>
<div id="profilePictureContainer">
    <img id="profilePicture" src="default-image.png" alt="Profile Picture" style="max-width: 150px; border-radius: 50%; display: block; margin-bottom: 10px;">
</div>
<label for="profilePictureUpload">Upload Image:</label>
<input type="file" id="profilePictureUpload" accept="image/*">
<br><br>
<label for="profilePictureURL">Or Enter Image URL:</label>
<input type="text" id="profilePictureURL" placeholder="Enter image URL">
<button onclick="saveProfilePicture()">Save Profile Picture</button>
    <textarea id="characterDetails" placeholder="Gacha offline code..." rows="150" cols="100"></textarea>
    <br>

    <h2>Age</h2>
    <input type="text" id="newAgePrompt" placeholder="Enter age/birthdate">
    <button onclick="addPrompt('age')">Add Age/Birthdate</button>
    <div id="ageList"></div>

    <h2>Appearance</h2>
    <input type="text" id="newAppearancePrompt" placeholder="Enter appearance detail">
    <button onclick="addPrompt('appearance')">Add Appearance</button>
    <div id="appearanceList"></div>

    <h2>Personality</h2>
    <input type="text" id="newPersonalityPrompt" placeholder="Enter personality detail">
    <button onclick="addPrompt('personality')">Add Personality</button>
    <div id="personalityList"></div>

    <h2>Backstory</h2>
    <input type="text" id="newBackstoryPrompt" placeholder="Enter backstory detail">
    <button onclick="addPrompt('backstory')">Add Backstory</button>
    <div id="backstoryList"></div>

    <h2>Code</h2>
    <input type="text" id="newCodePrompt" placeholder="Enter Code">
    <button onclick="addPrompt('code')">Add Code</button>
    <div id="codeList"></div>

    <div>
        <h2>Alternative Selves</h2>
        <input id="newAltSelfName" placeholder="Enter a new alternative self name">
        <button onclick="addAltSelf()">Add Alternative Self</button>
    </div>

    <div id="altSelfList"></div>
    

    
</body>
</html>
