<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Page</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="../js/family-page-script.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <nav>
        <div class="navbar">
            <a class="active" href="index.html"><i class="fa fa-home"></i></a>
            <div class="dropdown">
                <button class="dropbtn" id="colorModeToggle">Switch Mode</button>
                <div class="dropdown-content">
                    <a href="#" id="lightModeBtn" onclick="setColorMode('light')">Light</a>
                    <a href="#" id="darkModeBtn" onclick="setColorMode('dark')">Dark</a>
                    <a href="#" id="lowContrastModeBtn" onclick="setColorMode('low-contrast')">Low Contrast</a>
                    <a href="#" id="purpleModeBtn" onclick="setColorMode('purple')">Purple</a>
                </div>
            </div>
      
      <a href="index.html#news">News</a>
    </div>
    </div>
    </nav>
    <h1 id="familyTitle">Family Page</h1>

    <textarea id="familyContent" placeholder="Write your family content here..." rows="10" cols="50"></textarea>
    <br>

    <div id="familyTreeContainer"></div>

    <h3>Add Parent-Child Relationships</h3>
    <form id="familyForm">
        <label for="parent1Name">Parent 1 Name:</label>
        <input type="text" id="parent1Name" placeholder="Enter Parent 1 Name" required><br>
    
        <label for="parent2Name">Parent 2 Name (optional):</label>
        <input type="text" id="parent2Name" placeholder="Enter Parent 2 Name (optional)"><br>
    
        <label for="childrenNames">Children Names (comma separated):</label>
        <input type="text" id="childrenNames" placeholder="Enter Children Names" required><br>
    
        <button type="button" onclick="addFamilyRelationship()">Add Family</button>
    </form>
    
    <h3>Relationship Description:</h3>

</body>

</html>
