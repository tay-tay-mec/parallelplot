<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Info</title>
    <link rel="stylesheet" href="../css/styles.css"> 
    <link rel="stylesheet" href="../css/low.css"> 
    <link rel="stylesheet" href="../css/purple.css"> 
    <link rel="stylesheet" href="../css/high.css"> 
    <link rel="stylesheet" href="../css/light.css"> 
</head>
<body>
    <div class="tv-lines-overlay"></div>
    <div class="content">
    <header>
        <h1 id="humanName"></h1> <!-- This will show the human's name -->
    </header>

    <nav>
        <a href="../html/index.html">Home</a>
        <div class="dropdown">
            <a>Modes ▼</a>
            <div class="dropdown-content">
                <a id="lowContrastToggle">Low Contrast</a>
                <a id="highContrastToggle">High Contrast</a>
                <a id="LightToggle">Light Mode</a>
                <a id="PurpleToggle">Purple Mode</a>
            </div>
        </div>
        <a href="../html/au.html">Back to AU</a>
    </nav>
<div class="container">
    <div class="appearance">
        <div class="glitch" data-text="Appearance"><h1>Appearance</h1></div>
    <form id="addAppearanceForm">
        <input type="text" id="appearanceNameInput" placeholder="Enter appearance" required />
        <input type="file" id="imageInput" multiple accept="image/*" />
        <button type="submit">Add Appearance</button>
    </form>
    <ul id="appearanceList"></ul>
    </div>
    <div class="Personality">
        <h1>Personalities</h1>
        <form id="addPersonalityForm">
            <input type="text" id="personalityNameInput" placeholder="Enter personality" required />
            <button type="submit">Add Personality</button>
        </form>
        <ul id="personalityList"></ul>
    </div>

    <div class="Backstory">
        <h1>Backstory</h1>
        <form id="addBackstoryForm">
            <input type="text" id="backstoryNameInput" placeholder="Enter backstory" required />
            <button type="submit">Add Backstory</button>
        </form>
        <ul id="backstoryList"></ul>
    </div>

</div>

</div>
    <script src="../js/human.js"></script> <!-- Link to human.js file -->
</body>
</html>
